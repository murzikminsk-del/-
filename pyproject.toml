[project]
name = "rag-document-assistant"
version = "0.1.0"
requires-python = ">=3.11"

dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "openai>=1.0",
    "redis>=5.0",
    "httpx>=0.27",
    "pydantic-settings>=2.0",
    "structlog>=24.0",
    "arize-phoenix-otel>=0.6",
    "openinference-instrumentation-openai>=0.1",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]