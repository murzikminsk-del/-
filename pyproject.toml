[project]
name = "rag-document-assistant"
version = "0.1.0"
requires-python = ">=3.11"

dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "openai>=2.0,<3",
    "redis>=5.0",
    "httpx>=0.27",
    "pydantic-settings>=2.0",
    "structlog>=24.0",
    "arize-phoenix-otel>=0.6",
    "openinference-instrumentation-openai>=0.1",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "aiofiles>=23.0",
    "tiktoken>=0.7",
    "pysocks>=1.7.1",
    "aiogram>=3.27",
    "pypdf>=4.0",
    "python-docx>=1.1",
    "python-multipart>=0.0.9",
    "aiohttp>=3.9",
    "jinja2>=3.1",
    "tenacity>=9.0",
    "diskcache>=5.6",
    "tqdm>=4.66",
    "socksio>=1.0",
    "qdrant-client>=1.14",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "testcontainers[postgres]>=4.0",
]
